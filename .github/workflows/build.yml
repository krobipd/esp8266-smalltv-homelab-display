name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-esp8266-${{ hashFiles('firmware/platformio.ini') }}

      # Gepinnt auf den Stand des Entwicklungsrechners. Mit 6.2.0 raeumt jeder "pio run"
      # das Abbild des jeweils anderen Ziels weg (firmware.bin nach buildfs, littlefs.bin
      # nach dem Firmware-Build) -- die CI war deshalb seit der Erstveroeffentlichung rot.
      # Fuer ein Geraet ohne Rollback soll die CI ohnehin dasselbe Abbild bauen wie der Mac.
      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build firmware
        run: pio run
        working-directory: firmware

      - name: Build filesystem image
        run: pio run -t buildfs
        working-directory: firmware

      # Die Tests der Update-Erkennung laufen gegen die WIRKLICH gebauten Abbilder --
      # deshalb wird hier dasselbe Paket gebaut wie bei einem Release.
      - name: Package images
        run: tools/paket.sh

      # Ganze geraetelose Kette: Host-Tests (C++), Syntaxpruefung der Oberflaeche,
      # Verhaltenstests gegen den Mock.
      - name: Run test suite
        run: tools/run_tests.sh
