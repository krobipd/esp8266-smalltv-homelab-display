; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
; Gepinnt: Die CI soll dasselbe Abbild bauen wie der Entwicklungsrechner (kein Rollback
; auf dem Geraet). Bewusst anheben, nicht treiben lassen.
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder, time, colorize
build_flags = 
	-DNDEBUG
	-Iinclude
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
	; Zahlen als float statt double: Messwerte brauchen keine doppelte Genauigkeit,
	; und die doppelt genaue Verarbeitung zieht mehrere Kilobyte
	; Umwandlungscode aus der C-Bibliothek nach sich.
	-DARDUINOJSON_USE_DOUBLE=0
extra_scripts = 
	pre:scripts/git_version.py
	pre:scripts/fs_build_id.py
	post:scripts/strip_float_printf.py
check_tool = clangtidy
; Bewusst eng: nur bugprone, also Muster, die wirklich zu Fehlern fuehren. Mit den
; vollen modernize- und readability-Regeln meldete clang-tidy hunderte Treffer aus der
; uebernommenen Basis-Firmware -- eine Liste, die niemand liest, findet nichts.
; Ausgenommen: easily-swappable-parameters (traefe jede Zeichenfunktion mit x/y) und
; branch-clone (zwei gleich aussehende Zweige sind hier Absicht, nicht Versehen).
; readability-misplaced-array-index wurde erwogen und wieder verworfen: Sie haelt jeden
; ArduinoJson-Zugriff der Form doc["feld"] fuer einen verdrehten Array-Index -- 14 Treffer,
; alle falsch.
check_flags = 
	clangtidy: --checks=-*,bugprone-*,-bugprone-easily-swappable-parameters,-bugprone-branch-clone --warnings-as-errors=*
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	moononournation/GFX Library for Arduino@^1.6.4
