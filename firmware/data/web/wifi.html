<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WLAN</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/alpinejs.min.js" defer></script>
    <script src="./js/utils.js"></script>
    <script src="./js/themeSwitcher.js"></script>
    <script src="./js/wifiHandler.js"></script>
    <script src="./js/main.js"></script>
  </head>
  <body>
    <!-- Das Auge-Symbol (Passwort zeigen/verbergen) stand auf dieser Seite mehrfach in
         voller Laenge. Hier einmal als Vorlage, darunter nur noch Verweise darauf.
         Bewusst IN der Seite und nicht im nachgeladenen Kopfbereich: <use> loest seine
         Referenz beim Aufbau auf -- ein Symbol, das erst spaeter eintrifft, bliebe leer. -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden" aria-hidden="true">
      <symbol id="auge-zu" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 12c1.8-4 5.5-7 9.5-7 4 0 7.7 3 9.5 7-1.8 4-5.5 7-9.5 7-4 0-7.7-3-9.5-7z" />
        <path d="M3 3l18 18" />
      </symbol>
      <symbol id="auge-auf" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
    </svg>
    <main class="container">
      <header id="header-placeholder"></header>

      <section x-data="wifiHandler()" class="wifi-section">
        <h2>WLAN einrichten</h2>

        <div class="wifi-connect">
          <h3>Verbinden</h3>
          <form @submit.prevent="connect()">
            <label for="ssid">Netzwerkname (SSID)</label>
            <input
              id="ssid"
              x-model="ssid"
              name="ssid"
              type="text"
              autocomplete="off"
            />
            <label for="password">WLAN-Passwort</label>
            <div class="password-row">
              <input
                id="password"
                x-model="password"
                name="password"
                :type="showPassword ? 'text' : 'password'"
              />
              <button
                type="button"
                @click="showPassword = !showPassword"
                aria-label="Passwort anzeigen oder verbergen"
                class="eye-btn"
              >
                <svg x-show="!showPassword" width="18" height="18" aria-hidden="true"><use href="#auge-zu" /></svg>
                <svg x-show="showPassword" width="18" height="18" aria-hidden="true"><use href="#auge-auf" /></svg>
              </button>
            </div>
            <div class="action-row">
              <button type="submit" x-bind:disabled="connecting">
                Speichern & Verbinden
              </button>
              <button type="button" @click="forget()">Felder leeren</button>
            </div>
          </form>
          <p x-text="statusMsg"></p>
        </div>

        <div>
          <button class="scan-btn" @click="scan()" x-bind:disabled="scanning">
            Netzwerke suchen
          </button>
          <span x-show="scanning">Suche läuft…</span>
          <div class="scan-table-container">
            <table class="wifi-table">
              <thead>
                <tr>
                  <th class="col-ssid">Netzwerk</th>
                  <th class="col-signal">Empfang</th>
                  <th class="col-action"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="net in networks" :key="net.ssid">
                  <tr>
                    <td class="ssid-cell">
                      <strong x-text="net.ssid"></strong>
                    </td>
                    <td class="signal-cell">
                      <span x-text="net.rssiDisplay"></span>
                      <span class="bars" x-text="net.bars"></span>
                    </td>
                    <td class="action-cell">
                      <button @click="selectNetwork(net)">Wählen</button>
                    </td>
                  </tr>
                </template>
                <tr x-show="networks.length === 0 && !scanning">
                  <td colspan="3" class="no-networks">
                    <em>Keine Netzwerke gefunden</em>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <footer id="footer-placeholder"></footer>
    </main>
  </body>
</html>
