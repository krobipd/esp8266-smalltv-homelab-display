<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Protokoll</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/alpinejs.min.js" defer></script>
    <script src="./js/utils.js"></script>
    <script src="./js/themeSwitcher.js"></script>
    <script src="./js/logsHandler.js"></script>
    <script src="./js/main.js"></script>
  </head>
  <body>
    <main class="container">
      <header id="header-placeholder"></header>

      <section x-data="logsHandler()" x-init="init()">
        <h2>Protokoll</h2>

        <div
          style="margin-bottom: 1em; display: flex; gap: 0.5em; flex-wrap: wrap"
        >
          <button
            type="button"
            class="btn"
            @click="fetchLogs()"
            x-bind:disabled="loading"
          >
            Aktualisieren
          </button>
          <button
            type="button"
            class="btn"
            @click="downloadLogs()"
            x-bind:disabled="loading"
          >
            Herunterladen
          </button>
          <button
            type="button"
            class="btn danger"
            @click="clearLogs()"
            x-bind:disabled="loading"
          >
            Leeren
          </button>
        </div>

        <p>
          <small x-text="logs.length + ' Einträge'"></small>
        </p>
        <p>
          <small
            x-text="'Die letzten 20 Meldungen des Geräts. Ältere verdrängt der Puffer.'"
          ></small>
        </p>

        <div
          style="
            background: var(--bg);
            padding: 1em;
            border-radius: 4px;
            max-height: 60vh;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85em;
          "
        >
          <template x-if="logs.length === 0">
            <p style="color: var(--mut)">Keine Einträge</p>
          </template>
          <template x-for="(log, index) in logs" :key="index">
            <div
              x-text="log"
              style="
                white-space: pre-wrap;
                word-break: break-all;
                padding: 2px 0;
                border-bottom: 1px solid var(--bd);
              "
            ></div>
          </template>
        </div>

        <p x-show="message" x-text="message" style="margin-top: 1em"></p>
      </section>

      <footer id="footer-placeholder"></footer>
    </main>
  </body>
</html>
